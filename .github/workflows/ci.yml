name: CI

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install MinGW (GNU linker)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust GNU toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --locked --all --verbose

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: openniri-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/x86_64-pc-windows-gnu/debug/openniri.exe
            target/x86_64-pc-windows-gnu/debug/openniri-cli.exe
          if-no-files-found: error
          retention-days: 14

      - name: Run tests
        run: cargo test --locked --all --verbose

      - name: Run all-features tests
        run: cargo test --locked --workspace --all-features --verbose

      - name: Run ignored tests
        run: cargo test --locked --workspace -- --ignored

      - name: Run release-profile tests (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo test --locked --all --release --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --all -- -D warnings

      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit
