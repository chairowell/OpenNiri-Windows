# Builds the Windows distribution and publishes it.
#
#   tag push v*        -> build with the GNU toolchain, validate release metadata,
#                         publish the GitHub Release (zip + checksums + binaries)
#   workflow_dispatch  -> build only; the artifact stays attached to the run
#
# The binaries are built for x86_64-pc-windows-gnu (see .cargo/config.toml), so
# artifacts live under target/x86_64-pc-windows-gnu/release, not target/release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build (default: the ref this run was dispatched from)'
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-gnu

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      dist_name: ${{ steps.meta.outputs.dist_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install MinGW (GNU linker)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust GNU toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu

      - name: Determine bundle name
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cargoToml = Get-Content -Raw Cargo.toml
          $workspace = [regex]::Match($cargoToml, '(?ms)^\[workspace\.package\]\s*(?<body>.*?)(^\[|\z)')
          $version = [regex]::Match($workspace.Groups['body'].Value, '(?m)^\s*version\s*=\s*"(?<version>[^"]+)"').Groups['version'].Value
          if (-not $version) { throw 'Could not find workspace version in Cargo.toml.' }

          if ('${{ github.event_name }}' -eq 'push') {
            $tag = '${{ github.ref_name }}'
            "dist_name=openniri-windows-$tag" >> $env:GITHUB_OUTPUT
            $prerelease = if ($tag -match '-(alpha|beta|rc)') { 'true' } else { 'false' }
            "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          } else {
            $sha = (git rev-parse --short HEAD).Trim()
            "dist_name=openniri-windows-v$version-dev-$sha" >> $env:GITHUB_OUTPUT
            "prerelease=false" >> $env:GITHUB_OUTPUT
          }
          Write-Host "version=$version"

      - name: Validate release metadata (tag/version/changelog)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z\.-]+)?)$') {
            throw "Tag '$tag' must match v<semver> (example: v0.1.0 or v0.1.0-alpha.1)."
          }
          $tagVersion = $Matches['version']

          $cargoToml = Get-Content -Raw Cargo.toml
          $workspaceSection = [regex]::Match($cargoToml, '(?ms)^\[workspace\.package\]\s*(?<body>.*?)(^\[|\z)')
          if (-not $workspaceSection.Success) {
            throw 'Could not find [workspace.package] section in Cargo.toml.'
          }
          $versionMatch = [regex]::Match($workspaceSection.Groups['body'].Value, '(?m)^\s*version\s*=\s*"(?<version>[^"]+)"\s*$')
          if (-not $versionMatch.Success) {
            throw 'Could not find workspace version in Cargo.toml.'
          }
          $cargoVersion = $versionMatch.Groups['version'].Value

          if ($tagVersion -ne $cargoVersion) {
            throw "Tag version '$tagVersion' does not match Cargo.toml workspace version '$cargoVersion'."
          }

          $escapedVersion = [regex]::Escape($tagVersion)
          $changelog = Get-Content -Raw CHANGELOG.md
          if ($changelog -notmatch "(?m)^##\s+\[$escapedVersion\](?:\s+-\s+.*)?$") {
            throw "CHANGELOG.md must contain a release heading '## [$tagVersion]' before tagging."
          }

          Write-Host "Release metadata checks passed for $tag."

      - name: Enforce tag is main HEAD
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main --depth=1
          $mainHead = (git rev-parse origin/main).Trim()
          $tagCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $mainHead) {
            throw "Release blocked: tag commit ($tagCommit) is not the current origin/main HEAD ($mainHead)."
          }
          Write-Host 'Tag commit matches origin/main HEAD.'

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release binaries
        shell: pwsh
        run: cargo build --locked --release --workspace --target $env:TARGET

      - name: Run release-profile tests (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo test --locked --release --workspace

      - name: Package distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $distName = '${{ steps.meta.outputs.dist_name }}'
          $binDir = "target/$env:TARGET/release"

          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          foreach ($exe in 'openniri.exe', 'openniri-cli.exe') {
            $path = Join-Path $binDir $exe
            if (-not (Test-Path $path)) { throw "Missing build output: $path" }
            Copy-Item $path bundle/
          }
          Copy-Item README.md, CHANGELOG.md, LICENSE bundle/

          Compress-Archive -Path bundle/* -DestinationPath "$distName.zip" -Force

          $hashed = @("$distName.zip") + (Get-ChildItem bundle -File | ForEach-Object { $_.FullName })
          $lines = foreach ($file in $hashed) {
            $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $lines | Out-File -FilePath checksums.txt -Encoding utf8
          Get-Content checksums.txt

      - name: Upload distribution artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.meta.outputs.dist_name }}
          path: |
            ${{ steps.meta.outputs.dist_name }}.zip
            checksums.txt
            bundle/openniri.exe
            bundle/openniri-cli.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ needs.build.outputs.dist_name }}
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            release/${{ needs.build.outputs.dist_name }}.zip
            release/checksums.txt
            release/bundle/openniri.exe
            release/bundle/openniri-cli.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ needs.build.outputs.prerelease }}
